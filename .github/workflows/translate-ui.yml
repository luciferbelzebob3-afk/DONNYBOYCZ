name: DONNY BOY CZ – překlad nových textů
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
    outputs:
      sha:
        value: ${{ jobs.translate.outputs.sha }}
permissions:
  contents: write
jobs:
  translate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      sha: ${{ steps.notes.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-local-model
      - name: Nastavit autora
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Přeložit a ověřit literály
        run: python .github/scripts/donny/pipeline.py translate
      - name: Připravit české poznámky k vydání
        id: notes
        run: python .github/scripts/donny/pipeline.py notes
