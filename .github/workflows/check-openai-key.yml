name: DONNY BOY CZ – ověření API klíče
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths: ['.github/workflows/check-openai-key.yml']
permissions: {}
concurrency:
  group: donny-boy-api-key-check
  cancel-in-progress: false
jobs:
  check:
    name: Ověřit klíč a přístup k překladovému modelu
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Jeden minimální požadavek na překladové API
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TRANSLATION_MODEL: ${{ vars.OPENAI_TRANSLATION_MODEL || 'gpt-4.1-mini' }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          def fail(message):
              print("::error::" + message)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write("Ověření API klíče selhalo: " + message + "\n")
              sys.exit(1)
          key = os.environ.get("OPENAI_API_KEY", "")
          if not key:
              fail("Secret OPENAI_API_KEY není tomuto workflow dostupný.")
          payload = {
              "model": os.environ["OPENAI_TRANSLATION_MODEL"],
              "store": False,
              "max_output_tokens": 32,
              "instructions": "Return JSON with ok set to true.",
              "input": "Connectivity check.",
              "text": {"format": {"type": "json_schema", "name": "key_check", "strict": True,
                  "schema": {"type": "object", "properties": {"ok": {"type": "boolean"}},
                             "required": ["ok"], "additionalProperties": False}}}
          }
          request = urllib.request.Request(
              "https://api.openai.com/v1/responses",
              data=json.dumps(payload).encode(),
              headers={"Authorization": "Bearer " + key, "Content-Type": "application/json"},
              method="POST")
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              code = None
              try:
                  code = json.loads(error.read()).get("error", {}).get("code")
              except (ValueError, AttributeError):
                  pass
              reasons = {
                  "invalid_api_key": "API odmítlo klíč jako neplatný.",
                  "insufficient_quota": "Klíč narazil na nedostatečný kredit nebo limit API účtu.",
                  "model_not_found": "Nastavený model neexistuje nebo k němu klíč nemá přístup.",
                  "rate_limit_exceeded": "API odmítlo požadavek kvůli limitu rychlosti."
              }
              fail(reasons.get(code, "API požadavek selhal, HTTP " + str(error.code) + "."))
          except (OSError, ValueError):
              fail("Síťová chyba nebo neplatná odpověď API; platnost klíče nelze potvrdit.")
          if result.get("status") != "completed":
              fail("API nevrátilo dokončenou odpověď; ověření není úplné.")
          text = "".join(part.get("text", "") for item in result.get("output", [])
                         for part in item.get("content", []) if part.get("type") == "output_text")
          try:
              valid = json.loads(text) == {"ok": True}
          except ValueError:
              valid = False
          if not valid:
              fail("API odpovědělo, ale strukturovaný výstup neprošel kontrolou.")
          print("Klíč funguje: API přijalo požadavek a nastavený překladový model vrátil platný strukturovaný výstup.")
          usage = result.get("usage", {})
          counts = {field: usage.get(field) for field in ("input_tokens", "output_tokens", "total_tokens")}
          print("Spotřeba tokenů: " + json.dumps(counts))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("API klíč funguje. Ověřeno skutečným požadavkem na stejný model a endpoint jako překlad.\n\n")
              summary.write("Klíč ani obsah hlavičky Authorization nebyly vypsány.\n")
              summary.write("Spotřeba tokenů: " + json.dumps(counts) + "\n")
          PY
