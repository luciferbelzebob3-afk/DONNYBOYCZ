name: DONNY BOY – testy pracovní větve

on:
  push:
    branches: [codex/donnyboy-cz-assets-release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Kontrola publikační logiky
        run: python3 -m unittest discover -s .github/tests -p 'test_*.py' -v
      - name: Kontrola IR databází
        run: python3 scripts/tests/test_ir_universal_db.py
      - name: Kontrola výběru animací
        run: python3 scripts/tests/test_donny_animation_selection.py
