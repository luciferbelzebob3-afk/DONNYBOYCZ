name: Build DONNY BOY firmware

on:
  # Ruční spuštění pouze z Actions; commit do dev build automaticky nespustí.
  workflow_dispatch:
    inputs:
      build_updater:
        description: "Sestavit také updater balíček"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: donny-boy-firmware-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Flipper Zero firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib \
            python3 \
            python3-pip \
            python3-venv \
            git \
            make \
            cmake \
            ninja-build \
            dfu-util \
            libusb-1.0-0-dev \
            libudev-dev \
            libtool \
            pkg-config \
            autoconf \
            automake \
            texinfo

      - name: Build compact release firmware and updater
        run: ./fbt -j "$(nproc)" COMPACT=1 DEBUG=0 updater_package

      - name: Upload firmware output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DONNY-BOY-1.0.0-firmware
          path: |
            dist/f7-C/**
          if-no-files-found: warn
          retention-days: 14
