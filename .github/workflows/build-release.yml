name: DONNY BOY CZ – ověřené sestavení vydání
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      version:
        required: true
        type: string
    outputs:
      artifact_name:
        value: ${{ jobs.build.outputs.artifact_name }}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    outputs:
      artifact_name: DONNY-BOY-${{ inputs.version }}-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ověřit verzi a zdroj před sestavením
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          python - <<'PY'
          import json,os,re,subprocess
          p=json.load(open('.donny/pending.json'))
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+',os.environ['VERSION'])
          assert p['version']==os.environ['VERSION']
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['EXPECTED_SHA']
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          r=json.load(open('.donny/translation-report.json'))
          assert r['upstream_sha']==p['upstream_sha'] and r['ambiguous']==r['errors']==0
          PY
      - name: Sestavit firmware a aktualizační balíček
        env:
          VERSION: ${{ inputs.version }}
          DIST_SUFFIX: ${{ inputs.version }}
          WORKFLOW_BRANCH_OR_TAG: v${{ inputs.version }}
        run: ./fbt COMPACT=1 DEBUG=0 "DIST_SUFFIX=$VERSION" "UPDATE_VERSION_STRING=$VERSION" updater_package
      - name: Ověřit povinné výstupy, metadata a archivy
        run: python .github/scripts/donny/pipeline.py package
      - uses: actions/upload-artifact@v4
        with:
          name: DONNY-BOY-${{ inputs.version }}-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
