name: DONNY BOY CZ – ověření modelu bez API
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/check-local-model.yml'
      - '.github/actions/setup-local-model/**'
      - '.github/scripts/donny/local_inference.py'
      - '.github/scripts/donny/model_runtime.py'
      - '.github/scripts/donny/check_local_model.py'
      - '.github/tests/test_local_model.py'
      - '.donny/local-model.lock.json'
permissions:
  contents: read
concurrency:
  group: donny-local-model-check
  cancel-in-progress: false
jobs:
  verify:
    name: Ověřit model na CPU serveru GitHubu
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ověřit programové kontroly
        run: python -m unittest discover -s .github/tests -p 'test_*.py' -v
      - uses: ./.github/actions/setup-local-model
        id: local-model
      - name: Skutečný překlad a analýza bez externí inference
        run: python .github/scripts/donny/check_local_model.py
      - name: Zjistit připravenost runtime pro cache
        if: always()
        id: runtime-ready
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ.get('LOCAL_MODEL_ASSETS', '/tmp/not-prepared'))
          stamp = root / 'runtime-commit.txt'
          lock = json.loads(Path('.donny/local-model.lock.json').read_text())
          ready = (root / 'llama.cpp/build/bin/llama-server').is_file() and stamp.is_file() and stamp.read_text().strip() == lock['runtime_commit']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as file:
              file.write('ready=' + str(ready).lower() + '\n')
          PY
      - name: Uložit sestavený runtime i při chybě překladu
        if: always() && steps.runtime-ready.outputs.ready == 'true' && steps.local-model.outputs.runtime-cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/donny-local-model/llama.cpp/build/bin
            ${{ runner.temp }}/donny-local-model/runtime-commit.txt
          key: donny-llama-cpu-ubuntu24-x64-v1-620d2225cc436ab0b001e3200e590e3b286ef9ab
      - name: Uchovat výsledek a diagnostiku
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lokalni-model-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/donny-local-model-report.json
            ${{ runner.temp }}/donny-local-model/server.log
            ${{ runner.temp }}/donny-local-model/runtime-build.log
          if-no-files-found: ignore
          retention-days: 7
