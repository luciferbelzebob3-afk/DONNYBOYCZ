name: DONNY BOY CZ – ověření Gemini
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/check-gemini-key.yml'
      - '.github/scripts/donny/localization.py'
      - '.github/tests/test_gemini_client.py'
permissions:
  contents: read
concurrency:
  group: donny-boy-gemini-check
  cancel-in-progress: false
jobs:
  check:
    name: Testy a bezpečné ověření Gemini
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ověřit klienta, kvóty a navazování dávek
        run: python -m unittest discover -s .github/tests -p 'test_*.py' -v
      - name: Zjistit dostupnost Google klíče
        id: key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          available = bool(os.environ.get('GEMINI_API_KEY'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('available=' + str(available).lower() + '\n')
          if not available:
              message = 'GEMINI_API_KEY není uložený nebo není dostupný. Živé ověření nebylo provedeno; přidej klíč projektu bez fakturace v nastavení Actions secrets.'
              print('::notice::' + message)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(message + '\n')
          PY
      - name: Jeden minimální požadavek na Gemini
        if: steps.key.outputs.available == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TRANSLATION_MODEL: ${{ vars.GEMINI_TRANSLATION_MODEL || 'gemini-3.8-flash' }}
        run: |
          python - <<'PY'
          import os, sys, tempfile
          sys.path.insert(0, '.github/scripts/donny')
          from localization import model_json, ModelDeferred
          schema = {'type':'object','properties':{'ok':{'type':'boolean'}},'required':['ok'],'additionalProperties':False}
          with tempfile.TemporaryDirectory() as folder:
              os.environ['GEMINI_CACHE_PATH'] = folder + '/check.json'
              try:
                  result = model_json('Return JSON with ok set to true.', 'Connection check.', schema)
                  if result.get('ok') is not True:
                      raise RuntimeError('Gemini nevrátilo očekávaný ověřovací výsledek.')
              except Exception as error:
                  print('::error::' + str(error))
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                      summary.write('Živé ověření Gemini neuspělo: ' + str(error) + '\n')
                  sys.exit(1)
          print('Gemini API funguje: skutečný požadavek a strukturovaná odpověď ověřeny.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Gemini API funguje. Ověřeno skutečným požadavkem stejného klienta jako překlad. Klíč se nevypisuje. Fakturační tarif projektu z API klíče ověřit nelze; používej projekt bez zapnuté fakturace.\n')
          PY
