name: DONNY BOY CZ – automatické stabilní vydání

on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [unleashed-stable-release]
  push:
    branches: [dev]
    paths:
      - '.github/workflows/sync-unleashed.yml'
      - '.github/workflows/analyze-ui.yml'
      - '.github/workflows/translate-ui.yml'
      - '.github/workflows/build-release.yml'
      - '.github/scripts/donny/**'
      - '.github/tests/test_donny_pipeline.py'
      - '.github/tests/test_local_model.py'
      - '.donny/local-model.lock.json'
      - '.github/actions/setup-local-model/**'
      - '.donny/reviewed.json'
      - '.donny/upstream-notes-cs.json'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: donny-boy-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Zjistit stabilní vydání a připravit zdroje
    runs-on: ubuntu-22.04
    outputs:
      changed: ${{ steps.prepare.outputs.changed }}
      sha: ${{ steps.prepare.outputs.sha }}
      version: ${{ steps.prepare.outputs.version }}
      published: ${{ steps.prepare.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ověřit automatizační logiku
        run: python -m unittest discover -s .github/tests -p 'test_*.py' -v
      - name: Nastavit autora
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Připravit integrační větev a rezervovat verzi
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/donny/pipeline.py prepare
      - name: Uchovat diagnostiku
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostika-pripravy-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/donny-output/
          if-no-files-found: ignore

  analyze:
    name: Analýza textů displeje
    needs: prepare
    if: needs.prepare.outputs.changed == 'true' && needs.prepare.outputs.published != 'true'
    uses: ./.github/workflows/analyze-ui.yml
    with:
      source_sha: ${{ needs.prepare.outputs.sha }}

  translate:
    name: Překlad schválených textů
    needs: [prepare, analyze]
    if: needs.prepare.outputs.changed == 'true' && needs.prepare.outputs.published != 'true'
    uses: ./.github/workflows/translate-ui.yml
    with:
      source_sha: ${{ needs.analyze.outputs.sha }}

  build:
    name: Sestavení přesného českého zdroje
    needs: [prepare, translate]
    if: needs.prepare.outputs.changed == 'true' && needs.prepare.outputs.published != 'true'
    uses: ./.github/workflows/build-release.yml
    with:
      source_sha: ${{ needs.translate.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}

  publish:
    name: Ověřit soubory a publikovat vydání
    needs: [prepare, translate, build]
    runs-on: ubuntu-22.04
    if: needs.prepare.outputs.changed == 'true' && needs.prepare.outputs.published != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.translate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-assets
      - name: Ověřit součty a vazbu na zdroj
        env:
          EXPECTED_SHA: ${{ needs.translate.outputs.sha }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
          python - <<'PY'
          import json, os
          data=json.load(open('release-assets/sestaveni.json'))
          assert data['source_sha']==os.environ['EXPECTED_SHA']
          assert data['version']==os.environ['EXPECTED_VERSION']
          PY
      - name: Nastavit autora
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Publikovat ověřené vydání
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/donny/pipeline.py publish

  website:
    name: Aktualizovat a nasadit projektový web
    needs: [prepare, translate, publish]
    if: >-
      always() && needs.prepare.result == 'success' && needs.prepare.outputs.changed == 'true' &&
      (needs.publish.result == 'success' || needs.prepare.outputs.published == 'true')
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.translate.outputs.sha || needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Nastavit autora
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Aktualizovat README, metadata, šablonu hlášení a web
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/donny/pipeline.py web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Nasadit GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Ověřit živý web a uzavřít vydání
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/donny/pipeline.py verify_web
