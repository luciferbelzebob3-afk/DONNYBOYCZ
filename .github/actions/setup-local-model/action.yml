name: Připravit lokální model na serveru GitHubu
description: Model se stáhne a spustí až při prvním skutečném požadavku; žádné AI API klíče.
outputs:
  runtime-cache-hit:
    description: Připravený runtime je již v cache.
    value: ${{ steps.runtime.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Obnovit stažené váhy
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/donny-local-model/models
        key: donny-qwen3-8b-q4-v1-d98cdcbd03e17ce47681435b5150e34c1417f50b5c0019dd560e4882c5745785
    - name: Nastavit pracovní složku modelu
      shell: bash
      run: echo "LOCAL_MODEL_ASSETS=$RUNNER_TEMP/donny-local-model" >> "$GITHUB_ENV"
    - name: Obnovit ověřený CPU runtime
      id: runtime
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ runner.temp }}/donny-local-model/llama.cpp/build/bin
          ${{ runner.temp }}/donny-local-model/runtime-commit.txt
        key: donny-llama-cpu-ubuntu24-x64-v1-620d2225cc436ab0b001e3200e590e3b286ef9ab
